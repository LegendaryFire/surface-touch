# SPDX-License-Identifier: MIT
# surface-touch — the Intel THC functions belong to our intel_quickspi.
#
# `ithc` (shipped inside the linux-surface kernel package, drivers/hid/ithc)
# also claims the THC PCI functions on this machine's platform, and it has
# no decoder for what the touchpad streams once it is put into streaming
# mode: with ithc bound, the pad produces no pointer at all.  Blacklist it
# so the autoload cannot race this package's dkms module for the ports.
#
# blacklist — blocks the udev modalias autoload (the only path by which
#             ithc loads: PCI alias, no initramfs entry).
# install   — blocks an explicit `modprobe ithc` too, so nothing silent
#             re-arms it.  Forensics escape, if you ever want the old
#             driver back for a comparison run:
#               sudo modprobe --ignore-install ithc
blacklist ithc
install ithc /bin/false
